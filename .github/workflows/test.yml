name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Jest (unit + integration)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema=libs/prisma-service/prisma/schema.prisma

      - name: Run tests
        run: pnpm jest --config jest.ci.config.js --runInBand
