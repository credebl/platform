name: Continuous Delivery

# On every version tag (v*), build each service image natively on an AMD64 and an
# ARM64 runner and push per-architecture tags, then publish one multi-arch
# manifest per service under the release tag (and `latest` for stable tags).
#
# Building arm64 on a native runner replaces the QEMU emulation used before, which
# crashed or hung on some services (`qemu: uncaught target signal 4`) and made a
# normal run take up to 36 minutes per stuck image.
#
# The per-architecture images use staging tags scoped to the workflow run
# (ci-<run id>-<arch>). They cannot collide with release tags (v*), and a manifest
# is only built from images pushed by this run, never from an earlier run's.

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Safety net: a native build takes a few minutes
    timeout-minutes: 30

    strategy:
      # One failed image must not cancel the other services' builds
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        service:
          - agent-provisioning
          - agent-service
          - api-gateway
          - cloud-wallet
          - connection
          - geolocation
          - issuance
          - ledger
          - notification
          - user
          - utility
          - verification
          - webhook
          - organization
          - seed
          - x509
          - oid4vc-issuance
          - oid4vc-verification
          - ecosystem

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Extract Git Tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image ${{ matrix.service }} (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfiles/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:ci-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish ${{ matrix.service }} manifest
    runs-on: ubuntu-24.04
    needs: build
    # Run even when another service's build failed: each service only needs its
    # own two architecture images from this run, and the create step fails if one
    # is missing.
    if: ${{ !cancelled() }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - agent-provisioning
          - agent-service
          - api-gateway
          - cloud-wallet
          - connection
          - geolocation
          - issuance
          - ledger
          - notification
          - user
          - utility
          - verification
          - webhook
          - organization
          - seed
          - x509
          - oid4vc-issuance
          - oid4vc-verification
          - ecosystem

    permissions:
      contents: read
      packages: write

    steps:
      - name: Extract Git Tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-release tags (anything with a hyphen after the version, e.g. v2.3.0-rc.1
      # or v2.2.1-alpha.4) must not move the `latest` image tag.
      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE}:${TAG}")
          if [[ "${TAG}" != *-* ]]; then
            tags+=(--tag "${IMAGE}:latest")
          else
            echo "Not tagging latest: ${TAG} is a pre-release"
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMAGE}:ci-${GITHUB_RUN_ID}-amd64" \
            "${IMAGE}:ci-${GITHUB_RUN_ID}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
