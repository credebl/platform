version: '3.8'

services:
  openbao:
    image: openbao/openbao:latest
    container_name: openbao
    # Runs as openbao user (UID 100) instead of root
    user: "100:100"
    ports:
      - "8200:8200"
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
    volumes:
      - openbao_data:/bao/data
      - ./config/bao.hcl:/bao/config/bao.hcl:ro
    cap_add:
      - IPC_LOCK
    # Expressly point to the HCL config file
    command: ["server", "-config=/bao/config/bao.hcl"]
    restart: unless-stopped

volumes:
  openbao_data: