# .github/dependabot.yml

version: 2

updates:
  # =========================
  # pnpm Dependencies (via npm ecosystem)
  # =========================
  - package-ecosystem: "npm"
    directory: "/"              # or "/client" if package.json is inside a subfolder
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    groups:
      # NestJS framework packages (core, common, platform-*, websockets,
      # microservices, testing) are released in lockstep and must be bumped
      # together: microservices@11.2.5 deep-requires a helper that only exists
      # in core@11.2.x, so bumping one package alone breaks the runtime
      # (see PRs #1778 / #1779). Keep this group FIRST so it takes precedence
      # over the catch-all groups below, and cover security updates too —
      # #1778 itself was a Dependabot security PR, which bypasses
      # version-update groups unless listed explicitly.
      nestjs:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
      nestjs-security:
        applies-to: security-updates
        patterns:
          - "@nestjs/*"
      # 1) All patch updates in one PR
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # 2) All minor updates in one PR
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"

    allow:
      - dependency-type: "all"

    # uuid 11+ is ESM-only and cannot be loaded by the CommonJS jest runtime
    # (see revert of the uuid 14.0.0 bump). Re-enable once the app migrates to ESM.
    ignore:
      - dependency-name: "uuid"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    # --- Accepted risks (security-backlog remediation, 2026-10) ---
    # `pnpm audit` went from 70 advisories to the 3 below. They cannot be
    # closed by a version bump and are consciously accepted:
    # * aws-sdk (v2, root + libs/storage): EOL, upstream issued no patched
    #   release; migration to the v3 @aws-sdk/* clients is tracked
    #   separately (@aws-sdk/client-ses is already on v3). Low severity.
    # * uuid: a patched release exists (>=11.1.1) but 11+ is ESM-only and
    #   breaks the CommonJS jest runtime — see the ignore rule above.
    #   Moderate severity; re-evaluate with the ESM migration.
    # * braces: upstream advisory has no patched version; dev-only chain
    #   (eslint / typescript-eslint), not part of the runtime dependency
    #   graph. High severity, accepted until upstream ships a fix.
    # (request, extract-zip, node-forge and the old handlebars/critical
    # paths were cleared by removing the unused html-pdf, puppeteer and
    # node-html-to-image dependencies — see pnpm.overrides in package.json
    # for the transitive pins.)

    labels:
      - "dependencies"
      - "pnpm"

    commit-message:
      prefix: "chore"
      include: "scope"


  # =========================
  # GitHub Actions
  # =========================
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    groups:
      # 1) All patch updates in one PR
      patch-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
      # 2) All minor updates in one PR
      minor-actions:
        patterns:
          - "*"
        update-types:
          - "minor"

    labels:
      - "dependencies"
      - "github-actions"
      - "devops"

    commit-message:
      prefix: "ci"


  # =========================
  # Docker
  # =========================
  - package-ecosystem: "docker"
    directories:
      - "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    groups:
      # 1) All patch‑style updates in one PR
      patch-docker:
        patterns:
          - "*"
        update-types:
          - "patch"
      # 2) All minor‑style updates in one PR
      minor-docker:
        patterns:
          - "*"
        update-types:
          - "minor"

    labels:
      - "dependencies"
      - "docker"
      - "devops"

    commit-message:
      prefix: "build"


  # =========================
  # Docker Compose
  # =========================
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    groups:
      # 1) All patch‑style updates in one PR
      patch-docker-compose:
        patterns:
          - "*"
        update-types:
          - "patch"
      # 2) All minor‑style updates in one PR
      minor-docker-compose:
        patterns:
          - "*"
        update-types:
          - "minor"

    labels:
      - "dependencies"
      - "docker-compose"
      - "devops"

    commit-message:
      prefix: "build"