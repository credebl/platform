name: Continuous Delivery

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  
jobs:
  build-and-push:
    name: Push Docker image to GitHub
    runs-on: ubuntu-latest
    # Safety net: a normal build takes 3-7 minutes, see the step timeouts below
    timeout-minutes: 60

    strategy:
      # One stuck or failed image must not cancel the other services' builds
      fail-fast: false
      matrix:
        service:
          - agent-provisioning
          - agent-service
          - api-gateway
          - cloud-wallet
          - connection
          - geolocation
          - issuance
          - ledger
          - notification
          - user
          - utility
          - verification
          - webhook
          - organization
          - seed
          - x509
          - oid4vc-issuance
          - oid4vc-verification
          - ecosystem

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Extract Git Tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # Pre-release tags (anything with a hyphen after the version, e.g. v2.3.0-rc.1
      # or v2.2.1-alpha.4) must not move the `latest` image tag.
      - name: Compute image tags
        id: image_tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${TAG}"
            if [[ "${TAG}" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The emulated arm64 build occasionally hangs indefinitely. A normal build takes 3-7
      # minutes, so give up after 15 and retry once on a fresh builder; the hung BuildKit
      # instance may still be busy with the abandoned build.
      - name: Build and Push Docker Image ${{ matrix.service }}
        id: build
        continue-on-error: true
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfiles/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Set up a fresh Docker Buildx builder for the retry
        if: steps.build.outcome != 'success'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Retry Build and Push Docker Image ${{ matrix.service }}
        if: steps.build.outcome != 'success'
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfiles/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_tags.outputs.tags }}