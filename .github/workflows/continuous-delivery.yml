name: Continuous Delivery

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  
jobs:
  build-and-push:
    name: Push Docker image to GitHub
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - agent-provisioning
          - agent-service
          - api-gateway
          - cloud-wallet
          - connection
          - geolocation
          - issuance
          - ledger
          - notification
          - user
          - utility
          - verification
          - webhook
          - organization
          - seed
          - x509
          - oid4vc-issuance
          - oid4vc-verification
          - ecosystem

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Extract Git Tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfiles/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:latest